openapi: 3.0.3
info:
  title: Kamui Cloud API
  version: 0.1.0
  description: Compatibility contract for api (8080), store (9000) and infer (8090).
externalDocs:
  description: Durable coordinator workloads, workers and events
  url: ./core-openapi.yaml
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
tags:
  - name: health
  - name: nodes
  - name: jobs
  - name: workspaces
  - name: store
  - name: infer
paths:
  /healthz:
    get:
      tags: [health]
      operationId: healthz
      summary: Liveness check. Every service exposes it on its own port.
      security: []
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /v1/nodes/register:
    post:
      tags: [nodes]
      operationId: registerNode
      summary: Agent registers a node
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NodeInfo"
      responses:
        "201":
          description: Node registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Registration"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/nodes:
    get:
      tags: [nodes]
      operationId: listNodes
      summary: List all nodes with online or offline status
      responses:
        "200":
          description: All known nodes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Node"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/nodes/{id}/heartbeat:
    post:
      tags: [nodes]
      operationId: heartbeat
      summary: Agent heartbeat every 5 s. A node is offline after 15 s without one.
      parameters:
        - $ref: "#/components/parameters/NodeId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Load"
      responses:
        "204":
          description: Heartbeat accepted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/nodes/{id}:
    delete:
      tags: [nodes]
      operationId: leaveNode
      summary: Agent leaves cleanly
      parameters:
        - $ref: "#/components/parameters/NodeId"
      responses:
        "204":
          description: Node removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/jobs:
    post:
      tags: [jobs]
      operationId: createJob
      summary: Queue a Docker job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobCreate"
      responses:
        "201":
          description: Job queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    get:
      tags: [jobs]
      operationId: listJobs
      summary: List jobs, newest first
      responses:
        "200":
          description: All jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Job"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/jobs/claim:
    post:
      tags: [jobs]
      operationId: claimJob
      summary: A run worker claims the oldest queued job. Atomic, one job goes to one node.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [node_id]
              properties:
                node_id:
                  type: string
      responses:
        "200":
          description: Job claimed, status is now running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "204":
          description: No queued job
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/jobs/{id}:
    get:
      tags: [jobs]
      operationId: getJob
      summary: Get one job with its logs
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: The job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/jobs/{id}/finish:
    post:
      tags: [jobs]
      operationId: finishJob
      summary: A run worker reports the result
      parameters:
        - $ref: "#/components/parameters/JobId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [exit_code]
              properties:
                exit_code:
                  type: integer
                logs:
                  type: string
                  maxLength: 65536
      responses:
        "200":
          description: Job finished
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/workspaces:
    post:
      tags: [workspaces]
      operationId: createWorkspace
      summary: Create a new coding workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceCreate"
      responses:
        "201":
          description: Workspace created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    get:
      tags: [workspaces]
      operationId: listWorkspaces
      summary: List all workspaces
      responses:
        "200":
          description: All workspaces
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Workspace"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/workspaces/{id}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      tags: [workspaces]
      operationId: getWorkspace
      summary: Get workspace details
      responses:
        "200":
          description: The workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [workspaces]
      operationId: deleteWorkspace
      summary: Delete workspace metadata and container, retaining the project volume
      responses:
        "204":
          description: Workspace deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/workspaces/{id}/start:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    post:
      tags: [workspaces]
      operationId: startWorkspace
      summary: Start a workspace (launch code-server container)
      responses:
        "200":
          description: Workspace started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/workspaces/{id}/stop:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    post:
      tags: [workspaces]
      operationId: stopWorkspace
      summary: Stop a workspace
      responses:
        "200":
          description: Workspace stopped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/workspaces/{id}/restart:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    post:
      tags: [workspaces]
      operationId: restartWorkspace
      summary: Stop and start the workspace container
      responses:
        "200":
          description: Current workspace state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "502":
          description: Workspace manager unavailable
  /v1/workspaces/{id}/git/branch:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    post:
      tags: [workspaces]
      operationId: switchGitBranch
      summary: Create or switch to a branch in the workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [branch]
              properties:
                branch:
                  type: string
                  maxLength: 200
      responses:
        "204":
          description: Branch selected
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/workspaces/{id}/git/status:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      tags: [workspaces]
      operationId: getGitStatus
      summary: Get git status for workspace
      responses:
        "200":
          description: Git status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/workspaces/{id}/git/add:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    post:
      tags: [workspaces]
      operationId: gitAdd
      summary: Stage files for commit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GitAddRequest"
      responses:
        "204":
          description: Files staged
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/workspaces/{id}/git/commit:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    post:
      tags: [workspaces]
      operationId: gitCommit
      summary: Commit staged changes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GitCommitRequest"
      responses:
        "200":
          description: Commit created
          content:
            application/json:
              schema:
                type: object
                required: [hash]
                properties:
                  hash:
                    type: string
                    description: Full Git commit object ID.
                    pattern: "^([0-9a-f]{40}|[0-9a-f]{64})$"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/workspaces/{id}/git/push:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    post:
      tags: [workspaces]
      operationId: gitPush
      summary: Push commits to origin using Git credentials configured inside the workspace
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GitPushPullRequest"
      responses:
        "204":
          description: Pushed to remote
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/workspaces/{id}/git/pull:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    post:
      tags: [workspaces]
      operationId: gitPull
      summary: Pull changes from origin using a fast-forward update
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GitPushPullRequest"
      responses:
        "204":
          description: Pulled from remote
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/{bucket}:
    servers:
      - url: http://localhost:9000
    get:
      tags: [store]
      operationId: listObjects
      summary: List objects in a bucket
      parameters:
        - $ref: "#/components/parameters/Bucket"
      responses:
        "200":
          description: Objects in the bucket
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StoredObject"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/{bucket}/{key}:
    servers:
      - url: http://localhost:9000
    parameters:
      - $ref: "#/components/parameters/Bucket"
      - $ref: "#/components/parameters/Key"
    put:
      tags: [store]
      operationId: putObject
      summary: Upload a file. The bucket is created on first upload. Size limit is KAMUI_MAX_MB.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: Stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoredObject"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/TooLarge"
    get:
      tags: [store]
      operationId: getObject
      summary: Download a file as a stream
      responses:
        "200":
          description: File bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [store]
      operationId: deleteObject
      summary: Delete a file
      responses:
        "204":
          description: Deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /predict:
    servers:
      - url: http://localhost:8090
    post:
      tags: [infer]
      operationId: predict
      summary: Predict a digit from an 8x8 image flattened to 64 numbers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pixels]
              properties:
                pixels:
                  type: array
                  minItems: 64
                  maxItems: 64
                  items:
                    type: number
                    minimum: 0
                    maximum: 16
      responses:
        "200":
          description: Prediction
          content:
            application/json:
              schema:
                type: object
                required: [digit, confidence]
                properties:
                  digit:
                    type: integer
                    minimum: 0
                    maximum: 9
                  confidence:
                    type: number
                    minimum: 0
                    maximum: 1
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Send the join token as Authorization Bearer KAMUI_TOKEN. Every endpoint except /healthz needs it.
  parameters:
    NodeId:
      name: id
      in: path
      required: true
      schema:
        type: string
    JobId:
      name: id
      in: path
      required: true
      schema:
        type: string
    WorkspaceId:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: "^ws-[0-9a-f]{8,32}$"
    Bucket:
      name: bucket
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z0-9][a-z0-9-]{1,62}$"
    Key:
      name: key
      in: path
      required: true
      description: One path segment, no slash. Letters, digits, dot, underscore and hyphen only. Must not start with a dot and must not contain two dots in a row.
      schema:
        type: string
        pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,254}$"
  responses:
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing or wrong token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Not allowed in the current state
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooLarge:
      description: File is larger than KAMUI_MAX_MB
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unavailable:
      description: Service is not ready, for example the model is not loaded
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [bad_request, invalid_path, unauthorized, not_found, conflict, payload_too_large, unavailable, internal]
            message:
              type: string
      example:
        error:
          code: invalid_path
          message: key must not contain ..
    Health:
      type: object
      required: [status, service, version]
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string
          enum: [api, store, run, infer, train, console, drop]
        version:
          type: string
      example:
        status: ok
        service: api
        version: 0.1.0
    NodeInfo:
      type: object
      required: [hostname, os, arch, cpu_cores, ram_mb, ip]
      properties:
        hostname:
          type: string
        os:
          type: string
          enum: [macos, windows, linux]
        arch:
          type: string
          enum: [arm64, amd64]
        cpu_cores:
          type: integer
          minimum: 1
        ram_mb:
          type: integer
          minimum: 1
        gpu:
          type: string
          description: GPU name, empty string if none
        ip:
          type: string
        roles:
          type: array
          items:
            type: string
            enum: [store, run, train, infer, drop, console]
      example:
        hostname: kisu-mac
        os: macos
        arch: arm64
        cpu_cores: 10
        ram_mb: 16384
        gpu: Apple M5
        ip: 192.168.0.10
        roles: [console]
    Node:
      allOf:
        - $ref: "#/components/schemas/NodeInfo"
        - type: object
          required: [id, status, last_seen]
          properties:
            id:
              type: string
            status:
              type: string
              enum: [online, offline]
            last_seen:
              type: string
              format: date-time
    Registration:
      type: object
      required: [id, heartbeat_interval_s, offline_after_s]
      properties:
        id:
          type: string
        heartbeat_interval_s:
          type: integer
        offline_after_s:
          type: integer
      example:
        id: n-7f3a
        heartbeat_interval_s: 5
        offline_after_s: 15
    Load:
      type: object
      properties:
        cpu_pct:
          type: number
          minimum: 0
          maximum: 100
        mem_pct:
          type: number
          minimum: 0
          maximum: 100
    JobCreate:
      type: object
      required: [image]
      properties:
        image:
          type: string
        command:
          type: array
          items:
            type: string
      example:
        image: alpine:3.20
        command: [echo, hello]
    Job:
      type: object
      required: [id, image, status, created_at]
      properties:
        id:
          type: string
        image:
          type: string
        command:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [queued, running, succeeded, failed]
        node_id:
          type: string
        exit_code:
          type: integer
        logs:
          type: string
        created_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
    StoredObject:
      type: object
      required: [bucket, key, size, sha256, modified]
      properties:
        bucket:
          type: string
        key:
          type: string
        size:
          type: integer
          minimum: 0
        sha256:
          type: string
        modified:
          type: string
          format: date-time
    WorkspaceCreate:
      type: object
      required: [name, repository_url]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: At most 100 bytes.
        repository_url:
          type: string
          format: uri
          description: Public GitHub HTTPS repository URL without embedded credentials.
        branch:
          type: string
          maxLength: 200
          description: Leave empty to clone the repository's default branch.
      example:
        name: my-project
        repository_url: https://github.com/user/repo.git
        branch: main
    Workspace:
      type: object
      required: [id, name, repository_url, branch, status, created_at, updated_at]
      properties:
        id:
          type: string
        name:
          type: string
        repository_url:
          type: string
        branch:
          type: string
          description: Initial checkout branch. Empty selects the repository default; Git status shows the current branch.
        status:
          type: string
          enum: [creating, starting, running, stopping, stopped, error, unavailable]
          description: State observed from the workspace manager; unavailable indicates status could not be verified.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        last_active_at:
          type: string
          format: date-time
        container_id:
          type: string
        code_server_url:
          type: string
          description: Authenticated relative IDE URL, present only while running.
      example:
        id: ws-7f3a9b2c
        name: my-project
        repository_url: https://github.com/user/repo.git
        branch: main
        status: running
        created_at: "2026-01-15T10:00:00Z"
        updated_at: "2026-01-15T10:05:00Z"
        last_active_at: "2026-01-15T10:05:00Z"
        container_id: abc123def456
        code_server_url: /workspace/ws-7f3a9b2c/
    GitStatus:
      type: object
      required: [branch, ahead, behind, staged, unstaged, untracked]
      properties:
        branch:
          type: string
        ahead:
          type: integer
          minimum: 0
        behind:
          type: integer
          minimum: 0
        staged:
          type: array
          items:
            type: string
        unstaged:
          type: array
          items:
            type: string
        untracked:
          type: array
          items:
            type: string
      example:
        branch: main
        ahead: 1
        behind: 0
        staged: ["src/main.go"]
        unstaged: ["README.md"]
        untracked: ["temp.log"]
    GitAddRequest:
      type: object
      required: [files]
      properties:
        files:
          type: array
          items:
            type: string
      example:
        files: ["src/main.go", "README.md"]
    GitCommitRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 4096
          description: At most 4096 bytes.
      example:
        message: "Add new feature"
    GitPushPullRequest:
      type: object
      properties:
        remote:
          type: string
          enum: ["", origin]
          default: origin
        branch:
          type: string
      example:
        remote: origin
        branch: main
