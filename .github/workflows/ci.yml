name: CI

on:
  push:
    branches: [main, feat/mobile-workspace-mvp]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust (agent)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        if: hashFiles('agent/Cargo.toml') != ''
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Build
        if: hashFiles('agent/Cargo.toml') != ''
        working-directory: agent
        run: cargo build
      - name: Lint (clippy)
        if: hashFiles('agent/Cargo.toml') != ''
        working-directory: agent
        run: cargo clippy
      - name: Test
        if: hashFiles('agent/Cargo.toml') != ''
        working-directory: agent
        run: cargo test

  go:
    name: Go (${{ matrix.dir }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [api, store, run, cli]
    steps:
      - uses: actions/checkout@v4
      - name: Install Go
        if: hashFiles(format('{0}/**/*.go', matrix.dir)) != ''
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.dir }}/go.mod
          cache: false
      - name: Build
        if: hashFiles(format('{0}/**/*.go', matrix.dir)) != ''
        working-directory: ${{ matrix.dir }}
        run: go build ./...
      - name: Lint (go vet)
        if: hashFiles(format('{0}/**/*.go', matrix.dir)) != ''
        working-directory: ${{ matrix.dir }}
        run: go vet ./...
      - name: Test
        if: hashFiles(format('{0}/**/*.go', matrix.dir)) != ''
        working-directory: ${{ matrix.dir }}
        run: go test -race ./...

  python:
    name: Python (${{ matrix.dir }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [train, infer]
    steps:
      - uses: actions/checkout@v4
      - name: Install Python
        if: hashFiles(format('{0}/**/*.py', matrix.dir)) != ''
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # No heavy ML packages are installed here, so this checks syntax and lint only.
      - name: Syntax check
        if: hashFiles(format('{0}/**/*.py', matrix.dir)) != ''
        run: python -m compileall -q ${{ matrix.dir }}
      - name: Lint (ruff)
        if: hashFiles(format('{0}/**/*.py', matrix.dir)) != ''
        run: |
          pip install ruff
          ruff check ${{ matrix.dir }}

  node:
    name: TypeScript (${{ matrix.dir }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [console, drop]
    steps:
      - uses: actions/checkout@v4
      - name: Install Node
        if: hashFiles(format('{0}/package.json', matrix.dir)) != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked packages
        if: hashFiles(format('{0}/package-lock.json', matrix.dir)) != ''
        working-directory: ${{ matrix.dir }}
        run: npm ci --ignore-scripts
      - name: Build
        if: hashFiles(format('{0}/package.json', matrix.dir)) != ''
        working-directory: ${{ matrix.dir }}
        run: npm run build --if-present
      - name: Lint
        if: hashFiles(format('{0}/package.json', matrix.dir)) != ''
        working-directory: ${{ matrix.dir }}
        run: npm run lint --if-present
      - name: Test
        if: hashFiles(format('{0}/package.json', matrix.dir)) != ''
        working-directory: ${{ matrix.dir }}
        run: npm test --if-present

      - name: Check Console types and authentication
        if: matrix.dir == 'console' && hashFiles('console/package.json') != ''
        working-directory: console
        run: |
          npm run type-check
          npm run test:auth

  windows-powershell:
    name: Windows PowerShell 5.1 bootstrap
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse scripts and test credential onboarding
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSEdition -ne 'Desktop' -or $PSVersionTable.PSVersion.ToString() -notmatch '^5\.1') {
            throw 'Windows PowerShell 5.1 is required for this check.'
          }
          $paths = @('start-kamui.ps1', 'status-kamui.ps1', 'stop-kamui.ps1', 'test-kamui.ps1', 'ops/kamui.ps1')
          foreach ($path in $paths) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path).Path, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors) { throw "PowerShell could not parse $path" }
          }
          . ./ops/kamui.ps1
          $script:EnvPath = Join-Path $env:RUNNER_TEMP 'kamui bootstrap .env'
          try {
            Initialize-KamuiEnvironment
            $first = [IO.File]::ReadAllText($script:EnvPath)
            Initialize-KamuiEnvironment
            if ($first -cne [IO.File]::ReadAllText($script:EnvPath)) { throw 'Saved credentials changed' }
            [IO.File]::WriteAllText($script:EnvPath, "KAMUI_PORT=12345`nKAMUI_TOKEN=`n")
            Initialize-KamuiEnvironment
            $updated = [IO.File]::ReadAllText($script:EnvPath)
            if ($updated -notmatch 'KAMUI_PORT=12345' -or $updated -notmatch 'KAMUI_TOKEN=[a-f0-9]{64}' -or
                $updated -notmatch 'KAMUI_ADMIN_PASSWORD=[a-f0-9]{64}') { throw 'Could not preserve config and add credentials' }
          } finally {
            [IO.File]::Delete($script:EnvPath)
          }
      - name: Verify shell script line endings in a Windows-style checkout
        shell: powershell
        run: |
          $checkout = Join-Path $env:RUNNER_TEMP 'Kamui CRLF checkout'
          git -c core.autocrlf=true clone --no-local . $checkout
          if ($LASTEXITCODE -ne 0) { throw 'Could not clone the workspace for the portability check' }
          $script = Join-Path $checkout 'ops/nginx/generate-cert.sh'
          if ([IO.File]::ReadAllText($script).Contains("`r")) { throw 'Linux certificate script contains CRLF' }

  mobile-workspace:
    name: Docker and Mobile Workspace
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: kamui-ci-qa
      KAMUI_QA_PROJECT: kamui-ci-qa
    steps:
      - uses: actions/checkout@v4
      - name: Verify Linux AMD64 runner
        run: test "$(docker info --format '{{.OSType}}/{{.Architecture}}')" = "linux/x86_64"
      - name: Validate Dockerfiles and build toolchain
        shell: bash
        run: |
          set -eu
          test -f console/Dockerfile
          test -f ops/Dockerfile.workspace
          test -f ops/nginx/Dockerfile
          version="$(awk '$1 == "go" {print $2}' api/go.mod)"
          for file in api/Dockerfile api/Dockerfile.workspace-manager api/Dockerfile.ide-tunnel; do
            grep -Fx "FROM golang:$version-alpine AS builder" "$file"
            grep -Fx "ENV GOTOOLCHAIN=local" "$file"
          done
      - name: Configure isolated instance
        shell: bash
        run: |
          umask 077
          echo "KAMUI_TOKEN=$(openssl rand -hex 32)" > ops/.env
          echo "KAMUI_ADMIN_PASSWORD=$(openssl rand -hex 32)" >> ops/.env
          docker compose --env-file ops/.env -f ops/docker-compose.yml --profile tools config --quiet
      - name: Build with a clean cache
        run: docker compose --env-file ops/.env -f ops/docker-compose.yml build --pull --no-cache api console workspace-manager ide-tunnel workspace-proxy workspace-image
      - name: Start and validate nginx
        run: |
          docker compose --env-file ops/.env -f ops/docker-compose.yml run --rm --no-deps tls-init
          docker compose --env-file ops/.env -f ops/docker-compose.yml up -d --no-build --wait --wait-timeout 120
          docker compose --env-file ops/.env -f ops/docker-compose.yml exec -T workspace-proxy nginx -t
      - name: Test authenticated workspace lifecycle
        run: python3 ops/tests/stack.py
      - name: Diagnose failure
        if: failure()
        run: |
          docker compose --env-file ops/.env -f ops/docker-compose.yml ps -a
          docker compose --env-file ops/.env -f ops/docker-compose.yml logs --tail=100
