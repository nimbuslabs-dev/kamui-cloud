[project]
name = "infer"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "joblib>=1.6.0",
    "scikit-learn>=1.9.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
