# Workspace Proxy Configuration
# Routes requests to code-server instances based on workspace ID
# Uses Docker DNS resolution for dynamic container routing

# Upstream for Kamui Console (Next.js)
upstream console_backend {
    server console:3000;
}

# Upstream for Kamui API
upstream api_backend {
    server api:8080;
}

# Main server block
server {
    listen 80;
    server_name _;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "frame-ancestors 'self';" always;

    # Increase proxy buffer sizes for WebSocket
    proxy_buffers 8 16k;
    proxy_buffer_size 32k;

    # Health check endpoint
    location /healthz {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Kamui Console (Next.js) - Main UI
    location / {
        proxy_pass http://console_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # Kamui API
    location /api/ {
        proxy_pass http://api_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Workspace code-server instances - proxy via variable upstream with Docker DNS resolver
    # Pattern: /workspace/<workspace-id>/*
    location ~ ^/workspace/(?<workspace_id>[^/]+)(?<workspace_path>/.*)$ {
        # Use Docker DNS resolver (127.0.0.11) for dynamic container name resolution
        # Container name format: kamui-workspace-{workspace_id}
        # Port inside container: 8080
        resolver 127.0.0.11 valid=10s;
        set $workspace_host "kamui-workspace-$workspace_id";
        
        proxy_pass http://$workspace_host:8080$workspace_path$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Workspace-ID $workspace_id;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        
        # WebSocket support for code-server
        proxy_set_header Sec-WebSocket-Extensions $http_sec_websocket_extensions;
        proxy_set_header Sec-WebSocket-Key $http_sec_websocket_key;
        proxy_set_header Sec-WebSocket-Version $http_sec_websocket_version;
        
        # Handle code-server redirects properly
        proxy_redirect off;
        
        # Buffer settings for large responses
        proxy_buffering off;
    }
}