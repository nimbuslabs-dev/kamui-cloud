map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 443 ssl;
    server_name _;
    ssl_certificate /etc/kamui/tls/server.pem;
    ssl_certificate_key /etc/kamui/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 3s;
    set $console_backend console:3000;
    set $ide_tunnel ide-tunnel:8083;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # Request URLs can contain IDE connection data.
    access_log off;
    client_max_body_size 1m;
    proxy_http_version 1.1;

    location = /healthz {
        proxy_pass http://$console_backend/api/health;
    }

    location = /_kamui_ide_auth {
        internal;
        proxy_pass http://$console_backend/api/auth/ide;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Kamui-Upgrade $http_upgrade;
    }

    location = /api/auth/ide {
        return 404;
    }

    # The tunnel owns established upgrades and closes them when the Console
    # session is revoked. Regular HTTP keeps using the normal IDE proxy.
    location @ide_websocket {
        proxy_pass http://$ide_tunnel;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Authorization "";
        proxy_set_header X-CSRF-Token "";
        proxy_ignore_headers X-Accel-Redirect;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Clear-Site-Data;
        proxy_hide_header Service-Worker-Allowed;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location ~ "^/workspace/(?<workspace_id>ws-[a-f0-9]{8,32})/" {
        error_page 418 = @ide_websocket;
        if ($http_upgrade ~* "^websocket$") { return 418; }

        auth_request /_kamui_ide_auth;
        set $workspace_host kamui-workspace-$workspace_id;

        rewrite "^/workspace/ws-[a-f0-9]{8,32}(/.*)$" $1 break;
        proxy_pass http://$workspace_host:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade "";
        proxy_set_header Connection "";
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header X-CSRF-Token "";
        proxy_ignore_headers X-Accel-Redirect;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Clear-Site-Data;
        proxy_hide_header Service-Worker-Allowed;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_redirect off;
    }

    location /workspace/ {
        return 404;
    }

    location / {
        proxy_pass http://$console_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 165s;
    }
}
