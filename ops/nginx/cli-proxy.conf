server {
    listen 443 ssl;
    server_name _;
    ssl_certificate /etc/kamui/tls/server.pem;
    ssl_certificate_key /etc/kamui/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # A browser resolving an unrelated hostname to loopback must not reach the API.
    if ($host !~ "^(127\.0\.0\.1|localhost)$") { return 421; }

    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 3s;
    set $coordinator api:8080;

    access_log off;
    client_max_body_size 64k;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    proxy_http_version 1.1;
    proxy_set_header Cookie "";
    proxy_read_timeout 165s;
    proxy_redirect off;

    # Forward the same normalized path that was checked by the allowlist.
    location ~ "^/(healthz|v1/(workers/local|workload-events|workloads(/wl-[a-f0-9]{32}(/(cancel|logs))?)?|workspaces(/ws-[a-f0-9]{8,32}(/(start|stop|restart|git/(status|add|commit|branch|push|pull)))?)?|auth/(login|logout|register|me|active-project|sessions(/ses-[a-f0-9]{24})?)|identity/settings|users(/usr-[a-f0-9]{24}/(disable|enable))?|projects(/prj-[a-f0-9]{24}(/(members(/usr-[a-f0-9]{24})?|invitations(/inv-[a-f0-9]{24})?|audit-events))?|/default(/(members(/(usr-[a-f0-9]{24}|local-admin))?|invitations(/inv-[a-f0-9]{24})?|audit-events))?)?|invitations/accept|audit-events|github/(status|config|connection|repos|oauth/(start|exchange))|connect/(info|remote|pairings(/(redeem|pair-[a-f0-9]{24}))?|devices(/dev-[a-f0-9]{24}(/(approve|revoke))?)?)))$" {
        proxy_pass http://$coordinator$uri$is_args$args;
    }

    location ~ "^/v1/projects/(default|prj-[a-f0-9]{24})/inference/inf-[a-f0-9]{32}/proxy(/.*)?$" {
        proxy_buffering off;
        proxy_pass http://$coordinator$uri$is_args$args;
    }

    location ~ "^/v1/(backups(/(metadata|bck-[a-f0-9]{24}(/(content|restore))?))?|projects/(default|prj-[a-f0-9]{24})/backups/objects)$" {
        proxy_buffering off;
        proxy_pass http://$coordinator$uri$is_args$args;
    }

    location / { return 404; }
}
