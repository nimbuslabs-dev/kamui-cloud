server {
    listen 443 ssl;
    server_name _;
    ssl_certificate /etc/kamui/tls/server.pem;
    ssl_certificate_key /etc/kamui/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # A browser resolving an unrelated hostname to loopback must not reach the API.
    if ($host !~ "^(127\.0\.0\.1|localhost)$") { return 421; }

    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 3s;
    set $coordinator api:8080;

    access_log off;
    client_max_body_size 64k;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    proxy_http_version 1.1;
    proxy_set_header Cookie "";
    proxy_read_timeout 165s;
    proxy_redirect off;

    # Forward the same normalized path that was checked by the allowlist.
    location ~ "^/(healthz|v1/(workers/local|workload-events|workloads(/wl-[a-f0-9]{32}(/(cancel|logs))?)?|workspaces(/ws-[a-f0-9]{8,32}(/(start|stop|restart|git/(status|add|commit|branch|push|pull)))?)?))$" {
        proxy_pass http://$coordinator$uri$is_args$args;
    }

    location / { return 404; }
}
