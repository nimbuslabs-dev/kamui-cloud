name: kamui-cloud

services:
  api:
    build:
      context: ../api
    environment:
      KAMUI_TOKEN: ${KAMUI_TOKEN:?Set a strong KAMUI_TOKEN in ops/.env}
      WORKSPACE_MANAGER_URL: http://workspace-manager:8082
      KAMUI_WORKSPACE_DATA_FILE: /data/workspaces.json
    volumes:
      - kamui-api-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    networks: [control]

  workspace-manager:
    build:
      context: ../api
      dockerfile: Dockerfile.workspace-manager
    # Docker Desktop socket ownership varies. Only this trusted service gets daemon access.
    user: "0:0"
    cap_drop: [ALL]
    cap_add: [DAC_OVERRIDE]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    environment:
      KAMUI_TOKEN: ${KAMUI_TOKEN:?Set a strong KAMUI_TOKEN in ops/.env}
      KAMUI_PROJECT: ${COMPOSE_PROJECT_NAME}
      DOCKER_HOST: unix:///var/run/docker.sock
      DOCKER_NETWORK_NAME: ${COMPOSE_PROJECT_NAME}-ide
      WORKSPACE_IMAGE: ${COMPOSE_PROJECT_NAME}-workspace:local
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8082/healthz"]
      interval: 5s
      timeout: 4s
      retries: 12
    restart: unless-stopped
    networks: [control]
    cpus: 0.5
    mem_limit: 256m

  console:
    build:
      context: ../console
    environment:
      KAMUI_API_URL: http://api:8080
      KAMUI_TOKEN: ${KAMUI_TOKEN:?Set a strong KAMUI_TOKEN in ops/.env}
      KAMUI_ADMIN_PASSWORD: ${KAMUI_ADMIN_PASSWORD:?Set a strong KAMUI_ADMIN_PASSWORD in ops/.env}
    depends_on:
      api:
        condition: service_healthy
      workspace-manager:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 12
    restart: unless-stopped
    networks: [control]

  workspace-proxy:
    image: ${COMPOSE_PROJECT_NAME}-proxy:local
    build:
      context: ./nginx
    ports:
      - target: 443
        published: "${KAMUI_PORT:-8081}"
        host_ip: ${KAMUI_BIND_IP:-127.0.0.1}
        protocol: tcp
    volumes:
      - type: bind
        source: ${KAMUI_TLS_DIR:-./tls-local}/serving
        target: /etc/kamui/tls
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      console:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-q", "-O", "/dev/null", "https://127.0.0.1/healthz"]
      interval: 5s
      timeout: 4s
      retries: 12
    restart: unless-stopped
    networks: [control, ide]

  workspace-image:
    profiles: [tools]
    image: ${COMPOSE_PROJECT_NAME}-workspace:local
    build:
      context: .
      dockerfile: Dockerfile.workspace
    network_mode: none

  tls-init:
    profiles: [tools]
    image: ${COMPOSE_PROJECT_NAME}-proxy:local
    network_mode: none
    entrypoint: ["/bin/sh", "/usr/local/share/kamui/generate-cert.sh", "/tls", "${KAMUI_BIND_IP:-127.0.0.1}"]
    volumes:
      - type: bind
        source: ${KAMUI_TLS_DIR:-./tls-local}
        target: /tls

volumes:
  kamui-api-data:

networks:
  control:
    internal: true
  ide:
    name: ${COMPOSE_PROJECT_NAME}-ide
